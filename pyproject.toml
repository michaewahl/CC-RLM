[tool.poetry]
name = "cc-rlm"
package-mode = false
version = "0.1.0"
description = "Recursive Language Model Gateway — REPL-based context engine for Claude Code"
authors = ["Mike Wahl"]

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.3"
tiktoken = ">=0.6"         # token counting
gitpython = "^3.1"         # git diff walker
watchdog = "^4.0"          # pre-warming file watcher (optional — degrades gracefully)

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[tool.pytest.ini_options]
# package-mode = false means ccr/ and rlm/ are never installed into the venv,
# so the `pytest` console script can't import them (only `python -m pytest`
# puts CWD on sys.path). This makes `poetry run pytest` work either way.
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
